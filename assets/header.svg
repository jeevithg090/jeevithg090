<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
  <title id="t">Jeevith Gangadhara</title>
  <desc id="d">AI security, adversarial AI and LLM agents. The model proposes; code and humans decide.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080f"/>
      <stop offset=".55" stop-color="#0a1724"/>
      <stop offset="1" stop-color="#062a2c"/>
    </linearGradient>
    <radialGradient id="glow" cx="980" cy="160" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14b8a6" stop-opacity=".28"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#e6fffb"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity=".55"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>
  <style>
    .sans{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
    .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
    .rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
    .d1{animation-delay:.15s}.d2{animation-delay:.45s}.d3{animation-delay:.75s}.d4{animation-delay:1.05s}
    .spin{transform-box:view-box;transform-origin:980px 160px;animation:spin 5s linear infinite}
    .blip{animation:blip 5s ease-out infinite;transform-box:fill-box;transform-origin:center}
    .b2{animation-delay:1.6s}.b3{animation-delay:3.1s}
    .cursor{animation:blink 1.1s steps(1) infinite}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes blip{0%,100%{opacity:.15;transform:scale(.6)}12%{opacity:1;transform:scale(1.25)}40%{opacity:.35;transform:scale(1)}}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>
    <!-- radar -->
    <g fill="none" stroke="#2dd4bf">
      <circle cx="980" cy="160" r="44" stroke-opacity=".35"/>
      <circle cx="980" cy="160" r="88" stroke-opacity=".25"/>
      <circle cx="980" cy="160" r="132" stroke-opacity=".18"/>
      <circle cx="980" cy="160" r="176" stroke-opacity=".1"/>
      <path d="M980 -20V340M800 160H1160" stroke-opacity=".12"/>
    </g>
    <g class="spin">
      <path d="M980 160L1156 160A176 176 0 0 0 1104.5 35.6Z" fill="url(#sweep)" opacity=".55"/>
      <path d="M980 160H1156" stroke="#5eead4" stroke-width="2" stroke-opacity=".9"/>
    </g>
    <circle class="blip" cx="1040" cy="96" r="5" fill="#5eead4"/>
    <circle class="blip b2" cx="912" cy="236" r="4" fill="#f59e0b"/>
    <circle class="blip b3" cx="1098" cy="214" r="4" fill="#5eead4"/>
    <g class="mono" font-size="12" fill="#5eead4" fill-opacity=".55">
      <text x="1052" y="88">injection: refused</text>
      <text x="828" y="256">homoglyph: flagged</text>
    </g>
    <!-- text -->
    <text class="mono rise d1" x="72" y="74" font-size="15" letter-spacing="3" fill="#5eead4" fill-opacity=".85">OFFENSIVE SECURITY × AI</text>
    <text class="sans rise d2" x="70" y="152" font-size="62" font-weight="700" fill="url(#name)" letter-spacing="-1">Jeevith Gangadhara</text>
    <text class="sans rise d3" x="72" y="198" font-size="24" fill="#99f6e4">AI security · adversarial AI · LLM agents</text>
    <g class="rise d4">
      <text class="mono" x="72" y="258" font-size="18" fill="#94a3b8"><tspan fill="#2dd4bf">❯</tspan> the model proposes. code and humans decide.</text>
      <rect class="cursor" x="563" y="243" width="10" height="20" fill="#5eead4"/>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="319" rx="18" fill="none" stroke="#2dd4bf" stroke-opacity=".25"/>
</svg>
